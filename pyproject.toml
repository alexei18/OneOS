[project]
name = "uibridge"
version = "0.1.0"
description = "AI <-> native Windows app translation layer (semantic UI tree over MCP)"
readme = "README.md"
authors = [
    { name = "alexei18", email = "aonea1828@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.147.0",
    "mcp>=2.3.0",
    "playwright>=1.64.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "pywin32>=312",
    "uvicorn>=0.54.0",
    "xa11y>=0.15.2",
]

[project.scripts]
uibridge = "uibridge.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
